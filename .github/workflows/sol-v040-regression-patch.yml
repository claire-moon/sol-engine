name: SOL v0.4 regression source patch

on:
  push:
    branches:
      - sol/v0.4.0-playtest-regressions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sol/v0.4.0-playtest-regressions
      - name: Patch linked portal traversal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/playsim/p_map.cpp')
          source = path.read_text(encoding='utf-8')
          needle = (
              '\t\t\tline_t *ld = besthit.line;\n'
              '\t\t\tFLinePortal *port = ld->getPortal();\n'
              '\t\t\tif (port->mType == PORTT_LINKED)\n'
          )
          replacement = (
              '\t\t\tline_t *ld = besthit.line;\n'
              '\t\t\tFLinePortal *port = ld->getPortal();\n'
              '\t\t\tconst DVector2 solmove = tm.pos.XY() - thing->Pos().XY();\n'
              '\t\t\tconst bool sollocaltraversal =\n'
              '\t\t\t\tthing->player != nullptr &&\n'
              '\t\t\t\tport->mType == PORTT_LINKED &&\n'
              '\t\t\t\tld->args[2] == PORTT_LINKED &&\n'
              '\t\t\t\t(ld->args[0] == 9001 || ld->args[0] == 9002) &&\n'
              '\t\t\t\t(solmove | thing->Angles.Yaw.ToVector()) < 0.0;\n'
              '\n'
              '\t\t\tif (sollocaltraversal)\n'
              '\t\t\t{\n'
              '\t\t\t\tbreak;\n'
              '\t\t\t}\n'
              '\n'
              '\t\t\tif (port->mType == PORTT_LINKED)\n'
          )
          if source.count(needle) != 1:
              raise SystemExit('linked portal traversal anchor changed')
          path.write_text(source.replace(needle, replacement, 1), encoding='utf-8')
          PY
          git rm -- .github/workflows/sol-v040-regression-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/playsim/p_map.cpp
          git commit -m 'Fix backward TESTMAP portal traversal'
          git push origin HEAD:sol/v0.4.0-playtest-regressions
