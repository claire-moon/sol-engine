name: SOL engine identity

on:
  push:
    branches: [trunk, 'sol/**']
    paths:
      - 'sol/**'
      - 'tools/sol-*.sh'
      - 'tests/**'
      - 'docs/sol/**'
      - 'branding/sol/**'
      - 'branding/misc/appicon*'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'libraries/ZWidget/**'
      - 'wadsrc/**'
      - 'SOL.md'
      - 'ROADMAP.md'
      - 'THIRD_PARTY.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'sol/**'
      - 'tools/sol-*.sh'
      - 'tests/**'
      - 'docs/sol/**'
      - 'branding/sol/**'
      - 'branding/misc/appicon*'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'libraries/ZWidget/**'
      - 'wadsrc/**'
      - 'SOL.md'
      - 'ROADMAP.md'
      - 'THIRD_PARTY.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate metadata and scripts
        run: |
          python3 -m json.tool sol/version.json >/dev/null
          bash -n tools/sol-*.sh tests/*.sh
          grep -F 'tools/sol-launcher.sh' tools/sol-run.sh
          ! grep -F -- '-file' tools/sol-launcher.sh
          ! grep -F 'uzdoom' tools/sol-launcher.sh
          grep -F 'sol-runtime-package.sh' tools/sol-package.sh
          grep -F 'sol-bundle.sh' tools/sol-package.sh
          grep -F 'sol-bundle.sh' tools/sol-bundle.sh
          ! grep -F 'command -v uzdoom' tools/sol-run.sh
      - name: Validate release contract
        run: |
          python3 - <<'PY'
          import json
          with open('sol/version.json', encoding='utf-8') as f:
              version = json.load(f)
          assert version['version'] == '0.3.0'
          assert version['bundle_version'] == '0.3.0'
          assert version['editor_contract'] == '0.2.0'
          assert version['wadpack_contract'] == 2
          assert version['wadpack_entries'] == 18
          assert version['bundle_contract'] == 1
          assert version['bundle_name'] == 'sol.pk3'
          assert version['story_contract'] == 1
          assert version['map_contract'] == 'E1M1'
          PY
          test -s THIRD_PARTY.md
          grep -F 'not a relicensing mechanism' THIRD_PARTY.md
      - name: Validate native SOL identity and boot contract
        run: |
          grep -F 'set( ZDOOM_EXE_NAME "sol-engine"' CMakeLists.txt
          grep -F 'project(SOLEngine VERSION 0.3.0)' CMakeLists.txt
          grep -F '#define VERSIONSTR "0.3.0"' src/version.h
          grep -F '#define ENG_MAJOR 5' src/version.h
          grep -F '#define BASEWAD "sol-engine.pk3"' src/version.h
          grep -F '#define SOLBUNDLE "sol.pk3"' src/version.h
          grep -F '#define GAMENAME "SOL Engine"' src/version.h
          grep -F '#define GAMENAMELOWERCASE "sol-engine"' src/version.h
          grep -F '#define APPID "io.github.claire_moon.solengine"' src/version.h
          grep -F '#define QUERYIWADDEFAULT false' src/version.h
          grep -F '<id>io.github.claire_moon.solengine</id>' src/posix/freedesktop/io.github.claire_moon.solengine.metainfo.xml
          grep -F 'StartupWMClass=io.github.claire_moon.solengine' src/posix/freedesktop/io.github.claire_moon.solengine.desktop
          grep -F 'build_opts: &linux_opts -DSYSTEMINSTALL=ON -DCMAKE_INSTALL_PREFIX=/usr -DINSTALL_PK3_PATH=share/games/sol-engine' .github/workflows/continuous_integration.yml
          grep -F 'ValidateSolBundle(solbundle)' src/d_main.cpp
          grep -F 'manifestEntry != static_cast<int>(componentCount)' src/d_main.cpp
          grep -F 'bundle->FindEntry(expected.Archive)' src/d_main.cpp
          grep -F 'D_AddFile(allwads, solbundle.GetChars()' src/d_main.cpp
          grep -F 'MakeVersion(ENG_MAJOR, ENG_MINOR, ENG_REVISION)' src/common/scripting/frontend/zcc_parser.cpp
          grep -F 'doom.id.doom1.' src/d_iwad.cpp
          grep -F 'SOL Engine - Locate DOOM.WAD or DOOMU.WAD' src/d_iwad.cpp
          grep -F 'SOL_AllowProgressionWrite' src/sol/sol_run_state.cpp
          grep -F 'sol_run_modifications' src/g_game.cpp
          grep -F 'SOLMOD_ExtraFiles' src/d_main.cpp
          grep -F 'SOLMOD_Cheat' src/m_cheat.cpp
          grep -F 'SOLMOD_ConsoleTravel' src/g_level.cpp
      - name: Validate native embedded archive support
        run: |
          grep -F 'const char *c = strstr(FullName, ".wad")' src/common/filesystem/source/resourcefile.cpp
          grep -F 'Entries[entry].Flags |= RESFF_EMBEDDED' src/common/filesystem/source/resourcefile.cpp
          grep -F 'if (flags & RESFF_EMBEDDED)' src/common/filesystem/source/filesystem.cpp
          grep -F 'AddFile(path.c_str(), &embedded, filter, Printf, optional)' src/common/filesystem/source/filesystem.cpp
      - name: Test native development launcher
        run: bash tests/test-sol-launcher.sh
      - name: Validate story foundation
        run: bash tests/test-sol-story.sh
      - name: Validate ZScript entry point
        run: |
          grep -Fx 'version "4.14"' sol/game/ZSCRIPT
          grep -Fx '#include "zscript/sol/story_ids.zs"' sol/game/ZSCRIPT
          grep -Fx '#include "zscript/sol/story_state.zs"' sol/game/ZSCRIPT
          grep -Fx '#include "zscript/sol/bootstrap.zs"' sol/game/ZSCRIPT
          ! grep -Eq '^[[:space:]]*include[[:space:]]' sol/game/ZSCRIPT
      - name: Validate classic episode progression
        run: |
          grep -F 'map E1M1 "Hangar: Arrival"' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*levelnum[[:space:]]*=[[:space:]]*1$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*titlepatch[[:space:]]*=[[:space:]]*"WILV00"$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*next[[:space:]]*=[[:space:]]*"E1M2"$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*secretnext[[:space:]]*=[[:space:]]*"E1M9"$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*cluster[[:space:]]*=[[:space:]]*1$' sol/game/MAPINFO
          ! grep -Eiq '^[[:space:]]*nointermission([[:space:]]|$)' sol/game/MAPINFO
      - name: Package SOL-owned runtime component
        run: bash tools/sol-runtime-package.sh
      - name: Inspect runtime component and branding
        run: |
          archive=$(find build/sol -maxdepth 1 -name 'sol-v0.3.0.pk3' -print -quit)
          test -n "$archive"
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -Fx ZSCRIPT
          unzip -Z1 "$archive" | grep -Fx MAPINFO
          unzip -Z1 "$archive" | grep -Fx zscript/sol/story_ids.zs
          unzip -Z1 "$archive" | grep -Fx zscript/sol/story_state.zs
          unzip -Z1 "$archive" | grep -Fx zscript/sol/bootstrap.zs
          unzip -p "$archive" ZSCRIPT | grep -Fx '#include "zscript/sol/story_state.zs"'
          test -s branding/sol/sol-celestial-master.png
          test -s branding/misc/appicon.png
          test -s branding/misc/appicon.16.png
          test -s wadsrc/static/graphics/bootlogo.png
          test -s src/win32/icon1.ico
          test -s branding/sol/sol-engine.iconset/icon_16x16.png
          test -s branding/sol/sol-engine.iconset/icon_512x512@2x.png
          grep -F '`sol-celestial-master.png` is the original generated raster master' branding/sol/README.md
