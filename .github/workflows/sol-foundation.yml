name: SOL graybox

on:
  push:
    branches: [trunk, 'sol/**']
    paths:
      - 'sol/**'
      - 'tools/sol-*.sh'
      - 'docs/sol/**'
      - 'branding/sol/**'
      - 'branding/misc/appicon*'
      - 'SOL.md'
      - 'ROADMAP.md'
      - '.github/workflows/sol-foundation.yml'
  pull_request:
    paths:
      - 'sol/**'
      - 'tools/sol-*.sh'
      - 'docs/sol/**'
      - 'branding/sol/**'
      - 'branding/misc/appicon*'
      - 'SOL.md'
      - 'ROADMAP.md'
      - '.github/workflows/sol-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate metadata and scripts
        run: |
          python3 -m json.tool sol/version.json >/dev/null
          bash -n tools/sol-*.sh
          grep -F 'tools/sol-cockpit.sh' tools/sol-cockpit.sh
          grep -F 'tools/sol-test.sh' tools/sol-run.sh
          ! grep -F 'command -v uzdoom' tools/sol-run.sh
      - name: Validate release contract
        run: |
          python3 - <<'PY'
          import json
          with open('sol/version.json', encoding='utf-8') as f:
              version = json.load(f)
          assert version['version'] == '0.1.0'
          assert version['editor_contract'] == '0.1.0'
          assert version['wadpack_contract'] == 2
          assert version['wadpack_entries'] == 18
          assert version['map_contract'] == 'E1M1'
          PY
      - name: Validate ZScript entry point
        run: |
          grep -Fx 'version "4.14"' sol/game/ZSCRIPT
          grep -Fx '#include "zscript/sol/bootstrap.zs"' sol/game/ZSCRIPT
          ! grep -Eq '^[[:space:]]*include[[:space:]]' sol/game/ZSCRIPT
      - name: Validate classic episode progression
        run: |
          grep -F 'map E1M1 "Hangar: Arrival"' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*levelnum[[:space:]]*=[[:space:]]*1$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*titlepatch[[:space:]]*=[[:space:]]*"WILV00"$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*next[[:space:]]*=[[:space:]]*"E1M2"$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*secretnext[[:space:]]*=[[:space:]]*"E1M9"$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*cluster[[:space:]]*=[[:space:]]*1$' sol/game/MAPINFO
          ! grep -Eiq '^[[:space:]]*nointermission([[:space:]]|$)' sol/game/MAPINFO
      - name: Package SOL runtime
        run: bash tools/sol-package.sh
      - name: Inspect package and branding
        run: |
          archive=$(find build/sol -maxdepth 1 -name 'sol-v0.1.0.pk3' -print -quit)
          test -n "$archive"
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -Fx ZSCRIPT
          unzip -Z1 "$archive" | grep -Fx MAPINFO
          unzip -Z1 "$archive" | grep -Fx zscript/sol/bootstrap.zs
          unzip -p "$archive" ZSCRIPT | grep -Fx '#include "zscript/sol/bootstrap.zs"'
          test -s branding/sol/sol-icon-master.png
          test -s branding/misc/appicon.png
          test -s branding/misc/appicon.16.png
