name: SOL graybox

on:
  push:
    branches: [trunk, 'sol/**']
    paths:
      - 'sol/**'
      - 'tools/sol-*.sh'
      - 'docs/sol/**'
      - 'branding/sol/**'
      - 'branding/misc/appicon*'
      - 'SOL.md'
      - 'ROADMAP.md'
      - '.github/workflows/sol-foundation.yml'
  pull_request:
    paths:
      - 'sol/**'
      - 'tools/sol-*.sh'
      - 'docs/sol/**'
      - 'branding/sol/**'
      - 'branding/misc/appicon*'
      - 'SOL.md'
      - 'ROADMAP.md'
      - '.github/workflows/sol-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate metadata and scripts
        run: |
          python3 -m json.tool sol/version.json >/dev/null
          python3 -m json.tool sol/mods/stack.json >/dev/null
          bash -n tools/sol-*.sh
      - name: Validate mandatory SOL stack contract
        run: |
          python3 - <<'PY'
          import json
          expected = [
              ("PSSFX.zip", "PSSFX.zip", "copy"),
              ("flashlight_plus_plus_v9_1.7z", "flashlight_plus_plus_v9_1.pk3", "repack_zip"),
              ("FinalCustomDoom-v1.0.0-beta.pk3", "FinalCustomDoom-v1.0.0-beta.pk3", "copy"),
              ("jdra-Angled-Doom-Lite-1.2.1.pk3", "jdra-Angled-Doom-Lite-1.2.1.pk3", "copy"),
              ("TrooCullers2.5.pk3", "TrooCullers2.5.pk3", "copy"),
              ("TiltPlusPlus.pk3", "TiltPlusPlus.pk3", "copy"),
              ("Universal-Weapon-Sway-master.zip", "Universal-Weapon-Sway-master.zip", "normalize_zip"),
              ("nashgore_next.zip", "nashgore_next.zip", "copy"),
          ]
          with open("sol/mods/stack.json", encoding="utf-8") as handle:
              data = json.load(handle)
          assert data["schema"] == 1
          assert data["release"] == "0.1.0"
          actual = [(item["source"], item["mount"], item["prepare"]) for item in data["mods"]]
          assert actual == expected
          PY
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          while IFS= read -r mount; do
              touch "$tmp/$mount"
          done < <(python3 -c 'import json; print("\n".join(x["mount"] for x in json.load(open("sol/mods/stack.json"))["mods"]))')
          stack=$(bash tools/sol-stack.sh --root "$tmp")
          test "$(printf '%s\n' "$stack" | sed '/^$/d' | wc -l)" -eq 8
          printf '%s\n' "$stack" | head -n 1 | grep -Fx "$tmp/PSSFX.zip"
          printf '%s\n' "$stack" | tail -n 1 | grep -Fx "$tmp/nashgore_next.zip"
          rm -f "$tmp/TrooCullers2.5.pk3"
          if bash tools/sol-stack.sh --root "$tmp" >/dev/null 2>&1; then
              echo 'Stack validation accepted a missing mandatory mod' >&2
              exit 1
          fi
      - name: Validate classic episode progression
        run: |
          grep -F 'map E1M1 "Hangar: Arrival"' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*levelnum[[:space:]]*=[[:space:]]*1$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*titlepatch[[:space:]]*=[[:space:]]*"WILV00"$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*next[[:space:]]*=[[:space:]]*"E1M2"$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*secretnext[[:space:]]*=[[:space:]]*"E1M9"$' sol/game/MAPINFO
          grep -Eq '^[[:space:]]*cluster[[:space:]]*=[[:space:]]*1$' sol/game/MAPINFO
          ! grep -Eiq '^[[:space:]]*nointermission([[:space:]]|$)' sol/game/MAPINFO
      - name: Package SOL runtime
        run: bash tools/sol-package.sh
      - name: Inspect package and branding
        run: |
          archive=$(find build/sol -maxdepth 1 -name 'sol-v0.1.0.pk3' -print -quit)
          test -n "$archive"
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -Fx ZSCRIPT
          unzip -Z1 "$archive" | grep -Fx MAPINFO
          unzip -Z1 "$archive" | grep -Fx zscript/sol/bootstrap.zs
          test -s branding/sol/sol-icon-master.png
          test -s branding/misc/appicon.png
          test -s branding/misc/appicon.16.png
